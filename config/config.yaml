artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  source_URL: https://files.grouplens.org/datasets/movielens/ml-latest-small.zip
  local_data_file: artifacts/data_ingestion/data.zip
  unsizp_dir: artifacts/data_ingestion

data_validations:
  root_dir: artifacts/data_validation
  movies: artifacts/data_ingestion/ml-latest-small/movies.csv 
  ratings: artifacts/data_ingestion/ml-latest-small/ratings.csv 
  tags: artifacts/data_ingestion/ml-latest-small/tags.csv 
  STATUS_FILE: artifacts/data_validation/ml-latest-small/status.txt

data_validation:
  root_dir: artifacts/data_validation
  unzip_movies_dir: artifacts/data_ingestion/dataset.csv 
  STATUS_FILE: artifacts/data_validation/status.txt

data_processing:
  root_dir: artifacts/data_transformation
  movies: artifacts/data_ingestion/ml-latest-small/movies.csv 
  ratings: artifacts/data_ingestion/ml-latest-small/ratings.csv 
  tags: artifacts/data_ingestion/ml-latest-small/tags.csv

model_trainer:
  root_dir: artifacts/model_trainer
  model_name: model.h5
  learning_rate: 0.0001
  validation_split: 0.2
  batch_size: 32
  epochs: 20

model_evaluation:
  root_dir: artifacts/model_evaluation
  test_data_path: artifacts/data_transformation/test.csv
  model_path: artifacts/model_trainer/model.joblib
  metric_file_name: artifacts/model_evaluation/metrics.json